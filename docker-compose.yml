name: nexodocs

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped

    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend

    stop_grace_period: 30s

volumes:
  qdrant_data:
    name: nexodocs_qdrant_data

networks:
  backend:
    name: nexodocs_backend
    driver: bridge
