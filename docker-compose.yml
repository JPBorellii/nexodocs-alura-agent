name: nexodocs

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped

    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend

    stop_grace_period: 30s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.34.6
    restart: unless-stopped

    environment:
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}"

      N8N_HOST: "127.0.0.1"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_SECURE_COOKIE: "false"

      DB_TYPE: "sqlite"
      DB_SQLITE_POOL_SIZE: "4"

      GENERIC_TIMEZONE: "America/Sao_Paulo"
      TZ: "America/Sao_Paulo"

      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: "/files"

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      
    ports:
      - "127.0.0.1:5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n
      - ./knowledge-base:/files/knowledge-base:ro

    networks:
      - backend

    depends_on:
      - qdrant

    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  qdrant_data:
    name: nexodocs_qdrant_data

  n8n_data:
    name: nexodocs_n8n_data

networks:
  backend:
    name: nexodocs_backend
    driver: bridge
